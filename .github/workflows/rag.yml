# CI de l'assistant RAG (rag/, litellm/, bulle aidge_in_space/ui_assistant.py, sources documentaires)
#
# Job « lint-test » : ruff (fichiers listés dans ruff.toml) et pytest sur tests/rag ; puis, dans un environnement
# séparé (le paquet litellm et chromadb exigent des versions incompatibles de python-dateutil), la bascule
# LiteLLM hors ligne (litellm/test_fallback.py). LLM et Voyage simulés : aucun appel réseau, aucun secret.
# Job « eval » : mesure la qualité de la recherche (rag/eval/questions.yaml, chaîne Voyage complète) quand les sources
# ou le code de recherche changent. L'index est reconstruit à partir de la graine versionnée rag/seed/voyage.sqlite :
# seuls les passages modifiés depuis repartent chez Voyage (offre gratuite : ~16 passages par minute). Le cache est
# sauvegardé même si le job échoue ou est annulé, le run suivant reprend donc là où il s'est arrêté.
# Sources publiques seulement (--public-only) : les documents privés n'existent qu'en local. Secret requis :
# VOYAGE_API_KEY. Jamais sur une pull request venue d'un fork (pas de secret). Dépôt public : aucun runner
# auto-hébergé ici.
name: Assistant RAG

on:
  push:
    branches: [main, dev, "feature/**"]
    paths:
      - "rag/**"
      - "litellm/**"
      - "aidge_in_space/ui_assistant.py"
      - "tests/rag/**"
      - "docs/**"
      - "README.md"
      - "locod/spike/README.md"
      - "**.pdf"
      - "ruff.toml"
      - ".github/workflows/rag.yml"
  pull_request:
    paths:
      - "rag/**"
      - "litellm/**"
      - "aidge_in_space/ui_assistant.py"
      - "tests/rag/**"
      - "docs/**"
      - "README.md"
      - "locod/spike/README.md"
      - "**.pdf"
      - "ruff.toml"
      - ".github/workflows/rag.yml"
  workflow_dispatch:

concurrency:
  group: rag-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  # La table des prix de LiteLLM n'est pas téléchargée à l'import (tests hors ligne)
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  lint-test:
    name: Lint et tests (sans réseau)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rag/requirements.txt

      - name: Dépendances de l'assistant
        run: |
          python -m pip install -r rag/requirements.txt "gradio>=6.31.0" "pytest>=9.2.0" "ruff==0.17.4"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Tests de l'assistant
        run: python -m pytest -q tests/rag

      - name: Bascule LiteLLM (hors ligne, faux fournisseurs)
        run: |
          python -m venv /tmp/litellm-venv
          /tmp/litellm-venv/bin/pip install -q "litellm==1.106.8" "pytest>=9.2.0" pyyaml
          /tmp/litellm-venv/bin/python -m pytest -q litellm/test_fallback.py

  # Les sources ou la recherche ont-elles changé ? (catalogue, ingestion, recherche, questions, graine, docs, PDF)
  changes:
    name: Sources ou recherche modifiées ?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      search: ${{ steps.filter.outputs.search }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            search:
              - "rag/sources.yaml"
              - "rag/sources.py"
              - "rag/chunking.py"
              - "rag/ingest.py"
              - "rag/embeddings.py"
              - "rag/store.py"
              - "rag/retrieval.py"
              - "rag/config.py"
              - "rag/eval/**"
              - "rag/seed/**"
              - "docs/**"
              - "README.md"
              - "locod/spike/README.md"
              - "**.pdf"

  eval:
    name: Qualité de la recherche (Voyage)
    needs: [lint-test, changes]
    if: >-
      (needs.changes.outputs.search == 'true' || github.event_name == 'workflow_dispatch')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rag/requirements.txt

      - name: Dépendances de l'assistant
        run: python -m pip install -r rag/requirements.txt

      # Cache des vecteurs (en plus de la graine versionnée) et des sources téléchargées. Clé unique par run,
      # restauration du plus récent : les vecteurs calculés par un run échoué ou annulé ne sont pas perdus.
      - uses: actions/cache/restore@v6
        with:
          path: |
            rag/index/embeddings.sqlite
            rag/sources/cache
          key: rag-embeddings-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rag-embeddings-

      - name: Ingestion (sources publiques, Voyage, graine versionnée)
        run: |
          if [ -z "$VOYAGE_API_KEY" ]; then
            echo "::error::Secret VOYAGE_API_KEY absent (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          python -m rag.ingest --public-only --backend voyage

      - name: Évaluation de la recherche (questions de référence)
        run: python -m rag.eval.run --wait | tee eval.txt

      - name: Résumé
        if: always() && hashFiles('eval.txt') != ''
        run: |
          {
            echo "### Recherche RAG : $(grep "^Recherche :" eval.txt || echo "incomplète")"
            echo '```'
            cat eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            rag/index/embeddings.sqlite
            rag/sources/cache
          key: rag-embeddings-${{ github.run_id }}-${{ github.run_attempt }}
