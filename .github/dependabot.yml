# Mises à jour proposées chaque semaine en pull request, vérifiées par la même CI que le reste.
# Les mineures sont groupées en une seule pull request par écosystème, fusionnée automatiquement si la CI
# réussit (job automerge de ci-cd.yml). Les majeures restent une par une, à valider à la main.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      pip-mineures:
        update-types: [minor, patch]
    # numpy 2.5 et plus exigent Python 3.12, l'image est en 3.11 : à retirer en changeant de version de Python
    ignore:
      - dependency-name: numpy
        versions: [">=2.5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions-mineures:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    # Python 3.15 casse le build (pas de wheel onnxruntime) : changement de version à préparer à la main,
    # avec la borne de numpy ci-dessus
    ignore:
      - dependency-name: python
        versions: [">=3.12"]
