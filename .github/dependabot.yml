# Mises à jour proposées chaque semaine en pull request, vérifiées par la même CI que le reste
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # numpy 2.5 et plus exigent Python 3.12, l'image est en 3.11 : à retirer en changeant de version de Python
    ignore:
      - dependency-name: numpy
        versions: [">=2.5"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
