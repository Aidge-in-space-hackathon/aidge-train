# Mises à jour proposées chaque semaine en pull request, vérifiées par la même CI que le reste.
# Les mineures sont groupées en une seule pull request par écosystème, fusionnée automatiquement si la CI
# réussit (job automerge de ci-cd.yml). Les majeures restent une par une, à valider à la main.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      pip-mineures:
        update-types: [minor, patch]
    # numpy 2.5 et plus exigent Python 3.12, l'image est en 3.11 : à relever en changeant de version de Python,
    # sans dépasser le plafond de numba (numba 0.68 exige numpy<2.6 ; une mise à jour de numba le relève)
    ignore:
      - dependency-name: numpy
        versions: [">=2.5"]
      # gradio 6.31 exige pillow<13 : à retirer quand gradio l'accepte
      - dependency-name: pillow
        versions: [">=13"]
      # L'index cu126 de l'image CUDA s'arrête à 2.14.1 (la CI, en image CPU, ne le voit pas) :
      # à retirer quand cet index propose une version plus récente
      - dependency-name: torch
        versions: [">=2.15"]
      # Aidge : migration à la main sur une branche dédiée, en revalidant l'export (pièges propres à la 0.10.1).
      # La 0.11 (PR #30, fusionnée malgré la CI en échec) exige aidge_backend_cuda même sans GPU :
      # import aidge_core échoue dans l'image CPU (libcublas.so.12 absente).
      - dependency-name: "aidge-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions-mineures:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    # Python 3.15 casse le build (pas de wheel onnxruntime) : changement de version à préparer à la main,
    # avec la borne de numpy ci-dessus
    ignore:
      - dependency-name: python
        versions: [">=3.12"]
