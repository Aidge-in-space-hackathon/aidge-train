# Plateforme aidge-train : banc d'essai et entraînement (app + worker), GPU NVIDIA par défaut.
# Lancement :
#   docker compose up --build        puis http://localhost:7860
# Prérequis GPU : NVIDIA Container Toolkit, ou Docker Desktop + WSL2 avec pilote NVIDIA.
# PC sans carte NVIDIA : le worker ne peut pas démarrer, utiliser le venv (scripts/setup_venv.ps1).
# AIDGE_UI_BIND, AIDGE_UI_USERS et AIDGE_MAX_UPLOAD_MB : environnement ou fichier .env (jamais versionné).
# Nom de projet fixe : conserve le volume « aidge-in-space_runs » d'une version à l'autre.
name: aidge-in-space

services:
  # Interface Gradio. Torch CUDA est installé, mais aucune carte n'est réservée : le banc d'essai
  # mesure volontairement sur CPU, 1 thread.
  app:
    # Même image CUDA pour l'app et le worker : construite une seule fois, ici
    image: aidge-in-space:gpu
    build:
      context: .
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu126
    command: ["python", "-m", "aidge_in_space.app", "--host", "0.0.0.0", "--port", "7860"]
    ports:
      - "${AIDGE_UI_BIND:-127.0.0.1}:7860:7860"
    environment:
      AIDGE_RUNS_DIR: /runs
      AIDGE_UI_BIND: ${AIDGE_UI_BIND:-127.0.0.1}
      AIDGE_UI_USERS: ${AIDGE_UI_USERS:-}
      AIDGE_MAX_UPLOAD_MB: ${AIDGE_MAX_UPLOAD_MB:-500}
      # Assistant RAG (bulle de chat) : proxy LiteLLM du réseau compose, jamais publié sur l'hôte
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      EMBEDDINGS_BACKEND: ${EMBEDDINGS_BACKEND:-auto}
    # /runs est un volume nommé : le verrouillage SQLite n'est pas fiable sur un dossier Windows monté
    volumes:
      - .:/workspace
      - runs:/runs
    shm_size: 1gb
    # L'interface démarre même si LiteLLM est absent ou sans clé : la bulle l'indique
    depends_on:
      litellm:
        condition: service_started

  # Proxy LiteLLM de l'assistant RAG : modèle « assistant », bascule NVIDIA NIM -> Mistral -> Groq
  # (litellm/config.yaml). Aucun port publié : seule l'app l'appelle, sur http://litellm:4000.
  # Clés : fichier .env (voir .env.example). Image Docker Hub officielle, version figée.
  litellm:
    image: litellm/litellm:v1.106.8
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Table des modèles embarquée : pas de téléchargement au démarrage
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    # L'image (Wolfi) n'a pas curl : contrôle de santé en Python, route sans authentification
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      start_interval: 5s
      retries: 3
    restart: unless-stopped

  # Worker : exécute la file d'entraînement (docker compose up worker). Seul service à réserver la carte
  # NVIDIA. Ne pas le mélanger avec une interface lancée dans le venv.
  worker:
    image: aidge-in-space:gpu
    command: ["python", "-m", "aidge_in_space.worker"]
    environment:
      AIDGE_RUNS_DIR: /runs
    volumes:
      - .:/workspace
      - runs:/runs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    # Laisse le temps à un entraînement de sauvegarder (STOP_TIMEOUT_S = 60 s côté worker)
    stop_grace_period: 90s
    init: true
    shm_size: 1gb

volumes:
  runs: {}
