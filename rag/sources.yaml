    title: "Ballé, Laparra, Simoncelli : End-to-end Optimized Image Compression (ICLR 2017)"
    visibility: public
    kind: url
    url: https://arxiv.org/pdf/1611.01704v3
    version: arXiv 1611.01704v3
    file: balle2017_end2end_1611.01704v3.pdf
    sha256: fef402bbcd084e97c4c184a03c8893f6c027f5cadd23f30cf6c2265381bcf6ba
    license: licence arXiv (non exclusive)

