# Sources de l'assistant RAG : source unique de vérité pour l'ingestion (python -m rag.ingest).
#
# Chaque source a :
#   id          identifiant court, préfixe des noms affichés dans les citations
#   visibility  public : ingérée partout, y compris en CI et dans l'artefact d'index publié ;
#               private : ingérée en local seulement, jamais en CI ni dans l'artefact (python -m rag.ingest --public-only)
#   kind        url (un fichier téléchargé), git (fichiers d'un dépôt à un commit), repo (fichiers de ce dépôt),
#               local (dossier non versionné)
# Les téléchargements sont épinglés (version arXiv, version HAL, tag ou commit) et vérifiés par SHA-256 :
# un fichier qui a changé à la source est refusé, il faut alors mettre à jour cette entrée.
# Fichiers téléchargés : rag/sources/cache/ ; fichiers privés : rag/sources/private/ (non versionnés).
# Vérifié le 2026-11-12.

