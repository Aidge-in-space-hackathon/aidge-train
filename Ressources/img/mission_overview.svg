<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d3ee"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef476f"/>
    </marker>
    <linearGradient id="img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6b55"/>
      <stop offset="1" stop-color="#d9b48f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="470" rx="18" fill="#0e1530"/>
  <text x="34" y="46" font-size="22" font-weight="700" fill="#e8ecf8">AIDGE IN SPACE · chaîne de transmission d'images</text>
  <text x="34" y="70" font-size="14" fill="#9aa7c7">Compresser à bord du rover avec un réseau de neurones, transmettre peu de bits, reconstruire à l'arrivée</text>
  <rect x="24" y="92" width="584" height="232" rx="14" fill="#17213f" stroke="#2c3a66"/>
  <text x="44" y="120" font-size="13" font-weight="700" fill="#2ec4b6" letter-spacing="1">ROVER LUNAIRE</text>
  <text x="44" y="138" font-size="12" fill="#9aa7c7">embarqué · mémoire, CPU et énergie contraints</text>
  <g transform="translate(500,100)" fill="none" stroke="#c9d3ee" stroke-width="2">
    <rect x="10" y="22" width="62" height="16" rx="3" fill="#24315a"/>
    <line x1="56" y1="22" x2="56" y2="6"/>
    <rect x="50" y="0" width="16" height="8" rx="2" fill="#24315a"/>
    <circle cx="18" cy="44" r="6" fill="#0e1530"/>
    <circle cx="41" cy="44" r="6" fill="#0e1530"/>
    <circle cx="64" cy="44" r="6" fill="#0e1530"/>
  </g>
  <rect x="42" y="160" width="122" height="140" rx="10" fill="#1d2a52" stroke="#3a4a7e"/>
  <rect x="68" y="174" width="70" height="52" rx="4" fill="url(#img)"/>
  <path d="M68,226 L90,200 L104,214 L118,196 L138,226 z" fill="#5a4637" opacity="0.8"/>
  <text x="103" y="250" font-size="14" font-weight="700" fill="#e8ecf8" text-anchor="middle">Caméra</text>
  <text x="103" y="270" font-size="12" fill="#9aa7c7" text-anchor="middle">image x</text>
  <text x="103" y="287" font-size="12" fill="#9aa7c7" text-anchor="middle">8 bit/pixel</text>
  <rect x="184" y="160" width="134" height="140" rx="10" fill="#123a45" stroke="#2ec4b6" stroke-width="2"/>
  <text x="251" y="196" font-size="15" font-weight="700" fill="#e8ecf8" text-anchor="middle">Encodeur g_a</text>
  <text x="251" y="218" font-size="12" fill="#bfeee9" text-anchor="middle">3 × (conv + GDN)</text>
  <text x="251" y="248" font-size="11.5" fill="#9aa7c7" text-anchor="middle">opérateurs : Aidge</text>
  <text x="251" y="266" font-size="11.5" fill="#9aa7c7" text-anchor="middle">accélération : LoCod</text>
  <text x="251" y="284" font-size="11.5" fill="#9aa7c7" text-anchor="middle">Zynq PS + PL</text>
  <rect x="338" y="160" width="112" height="140" rx="10" fill="#3a2c18" stroke="#ff9f43" stroke-width="1.5"/>
  <text x="394" y="200" font-size="15" font-weight="700" fill="#e8ecf8" text-anchor="middle">Quantif.</text>
  <text x="394" y="226" font-size="13" fill="#ffd8a8" text-anchor="middle">ŷ = round(y)</text>
  <text x="394" y="258" font-size="11.5" fill="#9aa7c7" text-anchor="middle">entiers, latent</text>
  <text x="394" y="276" font-size="11.5" fill="#9aa7c7" text-anchor="middle">16 × 16 × 128</text>
  <rect x="470" y="160" width="122" height="140" rx="10" fill="#3a1830" stroke="#ef476f" stroke-width="1.5"/>
  <text x="531" y="196" font-size="15" font-weight="700" fill="#e8ecf8" text-anchor="middle">Codage</text>
  <text x="531" y="215" font-size="15" font-weight="700" fill="#e8ecf8" text-anchor="middle">entropique</text>
  <text x="531" y="244" font-size="11.5" fill="#9aa7c7" text-anchor="middle">arithmétique,</text>
  <text x="531" y="262" font-size="11.5" fill="#9aa7c7" text-anchor="middle">modèle de densité</text>
  <text x="531" y="280" font-size="11.5" fill="#9aa7c7" text-anchor="middle">appris</text>

  <line x1="164" y1="230" x2="182" y2="230" stroke="#c9d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="318" y1="230" x2="336" y2="230" stroke="#c9d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="230" x2="468" y2="230" stroke="#c9d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="594" y1="230" x2="758" y2="230" stroke="#ef476f" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrRed)"/>
  <path d="M680,186 L664,212 L678,212 L668,240 L694,206 L680,206 L690,186 z" fill="#ef476f"/>
  <text x="680" y="166" font-size="13" font-weight="700" fill="#ffb3c4" text-anchor="middle">Liaison radio</text>
  <text x="680" y="262" font-size="12" fill="#e8ecf8" text-anchor="middle">train binaire</text>
  <text x="680" y="280" font-size="12" fill="#9aa7c7" text-anchor="middle">bande passante</text>
  <text x="680" y="296" font-size="12" fill="#9aa7c7" text-anchor="middle">limitée</text>
  <rect x="762" y="92" width="414" height="232" rx="14" fill="#17213f" stroke="#2c3a66"/>
  <text x="782" y="120" font-size="13" font-weight="700" fill="#5b8def" letter-spacing="1">PLATEFORME SPATIALE</text>
  <text x="782" y="138" font-size="12" fill="#9aa7c7">réception · ressources plus confortables</text>
  <g transform="translate(1090,98)" stroke="#c9d3ee" stroke-width="1.6">
    <rect x="22" y="14" width="22" height="22" rx="3" fill="#24315a"/>
    <rect x="0" y="19" width="18" height="12" fill="#2b4c8c"/>
    <rect x="48" y="19" width="18" height="12" fill="#2b4c8c"/>
    <line x1="18" y1="25" x2="22" y2="25"/>
    <line x1="44" y1="25" x2="48" y2="25"/>
    <line x1="33" y1="14" x2="33" y2="6"/>
    <circle cx="33" cy="4" r="3" fill="#0e1530"/>
  </g>

  <rect x="780" y="160" width="118" height="140" rx="10" fill="#3a1830" stroke="#ef476f" stroke-width="1.5"/>
  <text x="839" y="196" font-size="15" font-weight="700" fill="#e8ecf8" text-anchor="middle">Décodage</text>
  <text x="839" y="215" font-size="15" font-weight="700" fill="#e8ecf8" text-anchor="middle">entropique</text>
  <text x="839" y="252" font-size="12" fill="#9aa7c7" text-anchor="middle">bits → ŷ</text>

  <rect x="918" y="160" width="118" height="140" rx="10" fill="#1a2b5c" stroke="#5b8def" stroke-width="2"/>
  <text x="977" y="196" font-size="15" font-weight="700" fill="#e8ecf8" text-anchor="middle">Décodeur g_s</text>
  <text x="977" y="218" font-size="12" fill="#c7d6ff" text-anchor="middle">3 × (IGDN</text>
  <text x="977" y="234" font-size="12" fill="#c7d6ff" text-anchor="middle">+ conv transposée)</text>

  <rect x="1056" y="160" width="106" height="140" rx="10" fill="#1d2a52" stroke="#3a4a7e"/>
  <rect x="1074" y="174" width="70" height="52" rx="4" fill="url(#img)" opacity="0.92"/>
  <path d="M1074,226 L1096,200 L1110,214 L1124,196 L1144,226 z" fill="#5a4637" opacity="0.75"/>
  <text x="1109" y="250" font-size="14" font-weight="700" fill="#e8ecf8" text-anchor="middle">Image x̂</text>
  <text x="1109" y="270" font-size="12" fill="#9aa7c7" text-anchor="middle">reconstruite</text>
  <text x="1109" y="287" font-size="12" fill="#9aa7c7" text-anchor="middle">≈ x</text>

  <line x1="898" y1="230" x2="916" y2="230" stroke="#c9d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1036" y1="230" x2="1054" y2="230" stroke="#c9d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <text x="34" y="362" font-size="13" font-weight="700" fill="#06d6a0" letter-spacing="1">CE QUE LE DÉMONSTRATEUR DOIT PROUVER</text>
  <g font-size="13" fill="#e8ecf8" text-anchor="middle">
    <rect x="24" y="378" width="216" height="62" rx="10" fill="#122f2f" stroke="#06d6a0"/>
    <text x="132" y="404" font-weight="700">Taux de compression</text>
    <text x="132" y="424" fill="#9aa7c7" font-size="12">débit en bit/pixel, ratio</text>

    <rect x="254" y="378" width="216" height="62" rx="10" fill="#122f2f" stroke="#06d6a0"/>
    <text x="362" y="404" font-weight="700">Qualité de l'image</text>
    <text x="362" y="424" fill="#9aa7c7" font-size="12">PSNR, MS-SSIM</text>

    <rect x="484" y="378" width="216" height="62" rx="10" fill="#122f2f" stroke="#06d6a0"/>
    <text x="592" y="404" font-weight="700">Empreinte mémoire</text>
    <text x="592" y="424" fill="#9aa7c7" font-size="12">poids, activations, pic</text>

    <rect x="714" y="378" width="216" height="62" rx="10" fill="#122f2f" stroke="#06d6a0"/>
    <text x="822" y="404" font-weight="700">Charge CPU, latence</text>
    <text x="822" y="424" fill="#9aa7c7" font-size="12">temps par image et par couche</text>

    <rect x="944" y="378" width="232" height="62" rx="10" fill="#122f2f" stroke="#06d6a0"/>
    <text x="1060" y="404" font-weight="700">Ressources FPGA</text>
    <text x="1060" y="424" fill="#9aa7c7" font-size="12">LUT, DSP, BRAM, transferts PS/PL</text>
  </g>
</svg>
