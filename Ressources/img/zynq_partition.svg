<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d3ee"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff9f43"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="520" rx="18" fill="#0e1530"/>

  <text x="34" y="46" font-size="22" font-weight="700" fill="#e8ecf8">Partitionnement PS / PL envisagé sur le Zynq-7020</text>
  <text x="34" y="70" font-size="14" fill="#9aa7c7">Hypothèse de départ, à confirmer par le profilage : les convolutions concentrent l'essentiel du calcul et partent en logique programmable</text>
  <rect x="24" y="90" width="1152" height="300" rx="16" fill="none" stroke="#3a4a7e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="44" y="114" font-size="12.5" fill="#9aa7c7" letter-spacing="1">SoC XILINX ZYNQ-7000 XC7Z020 · carte TUL PYNQ-Z2</text>
  <rect x="44" y="128" width="470" height="244" rx="14" fill="#17213f" stroke="#2ec4b6" stroke-width="2"/>
  <text x="64" y="158" font-size="17" font-weight="700" fill="#2ec4b6">PS · Processing System</text>
  <text x="64" y="180" font-size="13" fill="#9aa7c7">2 × ARM Cortex-A9 @ 650 MHz · Linux (image PYNQ)</text>
  <g font-size="13.5" fill="#e8ecf8">
    <rect x="64" y="196" width="430" height="36" rx="8" fill="#1d2a52"/>
    <text x="80" y="219">Acquisition de l'image et découpage en tuiles</text>
    <rect x="64" y="238" width="430" height="36" rx="8" fill="#123a45"/>
    <text x="80" y="261">Code C généré par Aidge : ordonnancement, GDN, quantif.</text>
    <rect x="64" y="280" width="430" height="36" rx="8" fill="#3a1830"/>
    <text x="80" y="303">Codage entropique du latent ŷ</text>
    <rect x="64" y="322" width="430" height="36" rx="8" fill="#122f2f"/>
    <text x="80" y="345">Instrumentation : temps, charge CPU, mémoire</text>
  </g>
  <rect x="686" y="128" width="470" height="244" rx="14" fill="#17213f" stroke="#ff9f43" stroke-width="2"/>
  <text x="706" y="158" font-size="17" font-weight="700" fill="#ff9f43">PL · Programmable Logic</text>
  <text x="706" y="180" font-size="13" fill="#9aa7c7">53 200 LUT · 106 400 FF · 220 DSP · 630 Ko de BRAM</text>
  <g font-size="13.5" fill="#e8ecf8">
    <rect x="706" y="196" width="430" height="36" rx="8" fill="#3a2c18" stroke="#ff9f43"/>
    <text x="722" y="219">acc0 : conv 9×9 ↓4   (étage 1)</text>
    <rect x="706" y="238" width="430" height="36" rx="8" fill="#3a2c18" stroke="#ff9f43"/>
    <text x="722" y="261">acc1 : conv 5×5 ↓2   (étages 2 et 3, ≈ 80 % des MAC)</text>
    <rect x="706" y="280" width="430" height="36" rx="8" fill="#2a2418" stroke="#ff9f43" stroke-dasharray="5 4"/>
    <text x="722" y="303">acc2 : GDN   (candidat selon le profilage)</text>
  </g>
  <text x="706" y="345" font-size="12.5" fill="#9aa7c7">Accélérateurs C → VHDL générés par LoCod (Panda Bambu)</text>
  <rect x="534" y="196" width="132" height="120" rx="10" fill="#0e1530" stroke="#c9d3ee" stroke-opacity="0.5"/>
  <text x="600" y="216" font-size="14" font-weight="700" fill="#e8ecf8" text-anchor="middle">AXI</text>
  <text x="600" y="233" font-size="11.5" fill="#9aa7c7" text-anchor="middle">générée par LoCod</text>
  <line x1="516" y1="262" x2="684" y2="262" stroke="#ff9f43" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="600" y="256" font-size="11.5" fill="#ffd8a8" text-anchor="middle">FPGA(fct, p, r, n)</text>
  <line x1="684" y1="292" x2="516" y2="292" stroke="#ff9f43" stroke-width="2.5" marker-end="url(#o)"/>
  <text x="600" y="308" font-size="11.5" fill="#ffd8a8" text-anchor="middle">wait_accelerator()</text>
  <rect x="44" y="414" width="1112" height="58" rx="12" fill="#1d2a52" stroke="#5b8def" stroke-width="1.5"/>
  <text x="600" y="440" font-size="15" font-weight="700" fill="#e8ecf8" text-anchor="middle">DDR3 512 Mo partagée</text>
  <text x="600" y="460" font-size="12.5" fill="#9aa7c7" text-anchor="middle">image d'entrée · poids (≈ 859 Kio en INT8, plus que la BRAM) · activations intermédiaires · train binaire</text>
  <line x1="279" y1="374" x2="279" y2="412" stroke="#c9d3ee" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="921" y1="374" x2="921" y2="412" stroke="#c9d3ee" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <text x="600" y="502" font-size="13" font-weight="700" fill="#ff9f43" text-anchor="middle">Axe d'optimisation clé : volume et fréquence des transferts PS ↔ PL, tuilage pour tenir en BRAM, précision INT8</text>
</svg>
