<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 578" width="1200" height="578" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d3ee"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#06d6a0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="578" rx="18" fill="#0e1530"/>

  <text x="34" y="46" font-size="22" font-weight="700" fill="#e8ecf8">Chaîne d'outils : du modèle entraîné à la carte</text>
  <text x="34" y="70" font-size="14" fill="#9aa7c7">Aidge produit le code C des opérateurs, LoCod synthétise la partie FPGA et l'interface PS / PL</text>

  <g transform="translate(0,18)">
  <path d="M28,100 L28,92 L688,92 L688,100" fill="none" stroke="#3a4a7e" stroke-width="2"/>
  <text x="358" y="86" font-size="12.5" fill="#9aa7c7" text-anchor="middle" letter-spacing="0.5">POSTE DE DÉVELOPPEMENT x86 (Linux ou WSL2)</text>
  <path d="M732,100 L732,92 L1172,92 L1172,100" fill="none" stroke="#3a4a7e" stroke-width="2"/>
  <text x="952" y="86" font-size="12.5" fill="#9aa7c7" text-anchor="middle" letter-spacing="0.5">CARTE CIBLE (Zynq)</text>
  <g>
    <rect x="28" y="110" width="200" height="320" rx="12" fill="#17213f" stroke="#5b8def" stroke-width="1.5"/>
    <rect x="28" y="110" width="200" height="46" rx="12" fill="#5b8def"/>
    <rect x="28" y="140" width="200" height="16" fill="#5b8def"/>
    <text x="44" y="140" font-size="16" font-weight="700" fill="#0e1530">1 · Entraînement</text>
    <g font-size="13" fill="#dfe6f7">
      <text x="44" y="186">PyTorch + CompressAI</text>
      <text x="44" y="208">ou TF Compression</text>
      <text x="44" y="230" fill="#9aa7c7">(bls2017.py)</text>
      <text x="44" y="258">perte R + λ·D</text>
      <text x="44" y="280">quantif. ≈ bruit uniforme</text>
      <text x="44" y="302">choix de N, de λ</text>
      <text x="44" y="324">export ONNX</text>
    </g>
    <rect x="44" y="380" width="168" height="32" rx="16" fill="#0e1530" stroke="#5b8def"/>
    <text x="128" y="401" font-size="12.5" fill="#c7d6ff" text-anchor="middle" font-family="Consolas, Menlo, monospace">balle2017.onnx</text>
  </g>
  <g>
    <rect x="258" y="110" width="200" height="320" rx="12" fill="#17213f" stroke="#2ec4b6" stroke-width="1.5"/>
    <rect x="258" y="110" width="200" height="46" rx="12" fill="#2ec4b6"/>
    <rect x="258" y="140" width="200" height="16" fill="#2ec4b6"/>
    <text x="274" y="140" font-size="16" font-weight="700" fill="#0e1530">2 · Aidge</text>
    <g font-size="13" fill="#dfe6f7">
      <text x="274" y="186">import ONNX</text>
      <text x="274" y="208">GDN en MetaOperator</text>
      <text x="274" y="230">recettes de graphe</text>
      <text x="274" y="252">quantif. INT8 (PTQ, QAT)</text>
      <text x="274" y="274">tuilage, élagage</text>
      <text x="274" y="296">planning mémoire statique</text>
      <text x="274" y="318">benchmarks intégrés</text>
      <text x="274" y="340">export C/C++ autonome</text>
    </g>
    <rect x="274" y="380" width="168" height="32" rx="16" fill="#0e1530" stroke="#2ec4b6"/>
    <text x="358" y="401" font-size="12.5" fill="#bfeee9" text-anchor="middle" font-family="Consolas, Menlo, monospace">code C statique</text>
  </g>
  <g>
    <rect x="488" y="110" width="200" height="320" rx="12" fill="#17213f" stroke="#ff9f43" stroke-width="1.5"/>
    <rect x="488" y="110" width="200" height="46" rx="12" fill="#ff9f43"/>
    <rect x="488" y="140" width="200" height="16" fill="#ff9f43"/>
    <text x="504" y="140" font-size="16" font-weight="700" fill="#0e1530">3 · LoCod</text>
    <g font-size="13" fill="#dfe6f7">
      <text x="504" y="186">macros FPGA() / CPU()</text>
      <text x="504" y="208">Panda Bambu : C → VHDL</text>
      <text x="504" y="230">architecture HDL générée</text>
      <text x="504" y="252">interfaces PS / PL</text>
      <text x="504" y="274">Vivado 2022.2</text>
      <text x="504" y="296">environnement Docker</text>
    </g>
    <rect x="504" y="380" width="168" height="32" rx="16" fill="#0e1530" stroke="#ff9f43"/>
    <text x="588" y="401" font-size="12.5" fill="#ffd8a8" text-anchor="middle" font-family="Consolas, Menlo, monospace">bitstream + binaire</text>
  </g>
  <g>
    <rect x="732" y="110" width="200" height="320" rx="12" fill="#17213f" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="732" y="110" width="200" height="46" rx="12" fill="#a78bfa"/>
    <rect x="732" y="140" width="200" height="16" fill="#a78bfa"/>
    <text x="748" y="140" font-size="16" font-weight="700" fill="#0e1530">4 · PYNQ-Z2</text>
    <g font-size="13" fill="#dfe6f7">
      <text x="748" y="186">Zynq-7000 XC7Z020</text>
      <text x="748" y="214" font-weight="700" fill="#e8ecf8">PS</text>
      <text x="748" y="234">2 × ARM Cortex-A9</text>
      <text x="748" y="262" font-weight="700" fill="#e8ecf8">PL</text>
      <text x="748" y="282">53 200 LUT · 220 DSP</text>
      <text x="748" y="304">630 Ko de BRAM</text>
      <text x="748" y="332">512 Mo DDR3</text>
    </g>
    <rect x="748" y="380" width="168" height="32" rx="16" fill="#0e1530" stroke="#a78bfa"/>
    <text x="832" y="401" font-size="12.5" fill="#ddd2ff" text-anchor="middle" font-family="Consolas, Menlo, monospace">exécution</text>
  </g>
  <g>
    <rect x="962" y="110" width="210" height="320" rx="12" fill="#17213f" stroke="#06d6a0" stroke-width="1.5"/>
    <rect x="962" y="110" width="210" height="46" rx="12" fill="#06d6a0"/>
    <rect x="962" y="140" width="210" height="16" fill="#06d6a0"/>
    <text x="978" y="140" font-size="16" font-weight="700" fill="#0e1530">5 · Mesures</text>
    <g font-size="13" fill="#dfe6f7">
      <text x="978" y="186">débit (bit/pixel), ratio</text>
      <text x="978" y="208">PSNR · MS-SSIM</text>
      <text x="978" y="230">vs JPEG / JPEG 2000</text>
      <text x="978" y="258">empreinte mémoire</text>
      <text x="978" y="280">charge CPU · latence</text>
      <text x="978" y="302">LUT · DSP · BRAM</text>
      <text x="978" y="324">temps de transfert PS/PL</text>
    </g>
    <rect x="978" y="380" width="178" height="32" rx="16" fill="#0e1530" stroke="#06d6a0"/>
    <text x="1067" y="401" font-size="12.5" fill="#b6f5e2" text-anchor="middle" font-family="Consolas, Menlo, monospace">rapport de mesures</text>
  </g>
  <line x1="229" y1="270" x2="256" y2="270" stroke="#c9d3ee" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="459" y1="270" x2="486" y2="270" stroke="#c9d3ee" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="689" y1="270" x2="730" y2="270" stroke="#c9d3ee" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="933" y1="270" x2="960" y2="270" stroke="#c9d3ee" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M1067,430 L1067,470 L358,470 L358,434" fill="none" stroke="#06d6a0" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <path d="M588,470 L588,434" fill="none" stroke="#06d6a0" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <path d="M358,470 L128,470 L128,434" fill="none" stroke="#06d6a0" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <text x="600" y="502" font-size="13.5" font-weight="700" fill="#06d6a0" text-anchor="middle">Boucle d'optimisation</text>
  <text x="600" y="524" font-size="12.5" fill="#9aa7c7" text-anchor="middle">taille du modèle (N), précision (FP32 → INT8), tuilage, choix des couches accélérées, interconnexions PS / PL</text>
  </g>
</svg>
