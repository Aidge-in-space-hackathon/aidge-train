# Proxy LiteLLM de l'assistant RAG (service « litellm » de docker-compose.yml, image litellm/litellm figée).
# L'application appelle le modèle « assistant » sur http://litellm:4000 avec le client OpenAI.
# Ordre de bascule : NVIDIA NIM (principal) -> Groq (secours).
# Offres gratuites uniquement : clés lues dans .env (voir .env.example), jamais écrites ici.
# Identifiants vérifiés le 2026-11-12 chez chaque fournisseur, appel d'outils compris (nemotron-3-super-120b-a12b,
# pourtant au catalogue NVIDIA, répond 404 « Function not found for account » à notre clé).
# Vérification hors ligne : python -m pytest litellm/test_fallback.py

model_list:
  # Principal : Nemotron 3.5 Lightning sur l'API NVIDIA (endpoint gratuit « Prototype », conditions d'essai NVIDIA)
  - model_name: assistant
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b
      api_key: os.environ/NVIDIA_NIM_API_KEY
      # Raisonnement coupé : des secondes de réflexion silencieuse avant chaque appel d'outil et chaque réponse,
      # pour un gain faible sur une réponse qui cite des passages fournis
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  # Secours : gpt-oss-120b, modèle de production Groq, offre gratuite
  - model_name: assistant-groq
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

router_settings:
  # Toute erreur restante après les nouvelles tentatives (429, 5xx, délai dépassé) bascule vers le secours
  fallbacks:
    - assistant: [assistant-groq]
  # Délai par appel, en secondes : au-delà, l'appel compte comme un échec et bascule
  timeout: 45
  num_retries: 1
  # 429 : inutile d'insister sur un quota épuisé, on bascule tout de suite. 5xx : une nouvelle tentative.
  retry_policy:
    RateLimitErrorRetries: 0
    TimeoutErrorRetries: 0
    InternalServerErrorRetries: 1
    AuthenticationErrorRetries: 0
    BadRequestErrorRetries: 0
  # Mise à l'écart (cooldown) d'un fournisseur après un échec : les questions suivantes vont directement au
  # secours pendant cooldown_time secondes, au lieu d'attendre une nouvelle erreur.
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 0
    TimeoutErrorAllowedFails: 0
    InternalServerErrorAllowedFails: 1
  cooldown_time: 60

litellm_settings:
  # Pas de télémétrie, pas de téléchargement de la table des prix au démarrage
  telemetry: false
  drop_params: true

general_settings:
  # Toute requête doit porter cette clé (Authorization: Bearer ...). Elle doit commencer par « sk- ».
  master_key: os.environ/LITELLM_MASTER_KEY
