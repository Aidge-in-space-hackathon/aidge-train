# JupyterLab (notebook de référence), image CPU. Indépendant de la plateforme (app + worker).
# Lancement :
#   docker compose -f docker-compose.notebook.yml up --build   puis http://localhost:8888
# Nom de projet distinct : un « down » ici n'affecte pas docker-compose.yml, et inversement.
name: aidge-in-space-notebook

services:
  notebook:
    build: .
    image: aidge-in-space:latest
    # Accessible uniquement depuis la machine locale (JupyterLab sans mot de passe)
    ports:
      - "127.0.0.1:8888:8888"
    # Le dépôt est monté : notebooks, data/ et outputs/ restent sur la machine hôte
    volumes:
      - .:/workspace
    shm_size: 1gb
