# Surcharge CPU de la plateforme, pour les PC sans carte NVIDIA : app et worker utilisent l'image
# CPU « aidge-in-space:latest » (torch CPU) et le worker ne réserve plus de GPU.
# Lancement :
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up --build
services:
  app:
    image: aidge-in-space:latest
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
  worker:
    image: aidge-in-space:latest
    # !reset vide la clé : pas de réservation de carte NVIDIA
    deploy: !reset null
